<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Diamond Animated Background</title>
    <style>
        /* Full screen body setup with perspective */
        body {
            margin: 0;
            height: 100vh;
            background: #272d38cb; /* deep blue base */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            position: relative;
            font-family: Arial, sans-serif;
        }

        /* Diamond background container with grid layout and 3D rotation */
        .diamond-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 120vw;
            height: 120vh;
            transform-style: preserve-3d;
            transform-origin: center;
            transform: rotateX(90deg) rotateZ(85deg);
            animation: rotateDiamonds 20s linear infinite;
            pointer-events: none;
            z-index: 0;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 10px;
        }

        /* Each diamond is a rotated square with gradient */
        .diamond {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #64b5f6, #1976d2);
            transform: rotate(45deg);
            opacity: 0.7;
            border-radius: 4px;
            animation: pulse 5s ease-in-out infinite;
        }

        /* Alternate diamonds animate out of phase for subtle effect */
        .diamond:nth-child(even) {
            animation-delay: 2.5s;
        }

        /* Diamond pulsing scale and opacity */
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: rotate(45deg) scale(1); }
            50% { opacity: 1; transform: rotate(45deg) scale(1.2); }
        }

        /* Slow rotation of diamond grid for 3D effect */
        @keyframes rotateDiamonds {
            0% { transform: rotateX(40deg) rotateZ(0deg); }
            100% { transform: rotateX(40deg) rotateZ(360deg); }
        }

        /* Your container content styling and positioning */
    .container {
    max-width: 800px;
    width: 80%;
    background: rgba(255, 255, 255, 0.3);
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
    color: #000;
    margin: 0; /* Remove margin-left */
}



        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="url"], input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #04295d;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        button:hover {
            background-color: #1e4a86;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }
    </style>
</head>
<body>
    <div class="diamond-bg">
        <!-- 100 diamond divs created via JS below -->
    </div>

    <div class="container">
        <h1>URL Shortener</h1>
        <form id="shorten-form">
            <div>
                <label for="url">Enter URL:</label>
                <input type="url" name="url" id="url" required />
            </div>
            <div>
                <label for="shortCode">Enter ShortCode:</label>
                <input type="text" name="shortCode" id="shortCode" required />
            </div>
            <button type="submit">Shorten URL</button>
        </form>
        <h2>Shortened URLs</h2>
        <ul id="shortened-urls"></ul>
    </div>

    <script>
        // Dynamically generate 100 diamond divs inside diamond-bg container
        const diamondContainer = document.querySelector(".diamond-bg");
        for (let i = 0; i < 100; i++) {
            const diamond = document.createElement("div");
            diamond.classList.add("diamond");
            diamondContainer.appendChild(diamond);
        }

        // url logic

        document.getElementById('shorten-form').addEventListener(
            'submit', (event) =>{
                event.preventDefault();
                const formData = new FormData(event.target);
                const url = formData.get('url');
                const shortCode = formData.get('shortCode');
            }
        )
    </script>
</body>
</html>
